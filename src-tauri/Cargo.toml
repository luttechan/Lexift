[package]
name = "lexift-desktop"
version = "1.2.1"
description = "Lexift Windows desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
strip = true
